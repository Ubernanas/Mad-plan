# Fly.io config for Madplan. One always-on machine, so cron can run on Sundays.
app = "madplan-tristan"   # Dit eget navn: `fly launch` skriver det her (se README.md)
primary_region = "arn"   # Stockholm

[build]

[env]
  PORT = "3000"

# SQLite and Claude's working folder. A volume belongs to one machine, so this app runs on one.
[[mounts]]
  source = "madplan_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: a stopped machine would miss Sunday's fetch and plan.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # Node plus the Claude Code CLI while a plan is made
